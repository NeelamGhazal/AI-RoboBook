name: Validate Internal Links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-links:
    name: Check for broken internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Serve and check links
        run: |
          npm run serve &
          sleep 10
          npx broken-link-checker http://localhost:3000 --recursive --only-internal-links --filter-level 2